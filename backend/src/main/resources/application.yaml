spring:
  autoconfigure:
    exclude:
      - io.awspring.cloud.autoconfigure.s3.S3AutoConfiguration
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 14MB
  datasource:
    url: jdbc:mysql://gwon-db:3306/greeneye?serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update # 엔티티 변경사항을 DB에 자동 반영 (핵심!)
    properties:
      hibernate:
        format_sql: true
        show_sql: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@greeneye.local}}

google:
  client:
    id: ${GOOGLE_CLIENT_ID}

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    # 분류: gemini-3.5-flash (비전). 한도/비용 이슈 시 GEMINI_MODEL=gemini-3.1-flash-lite
    model: ${GEMINI_MODEL:gemini-3.5-flash}
    fallback-model: ${GEMINI_FALLBACK_MODEL:gemini-3.1-flash-lite}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:45}
    max-retries: ${GEMINI_MAX_RETRIES:1}
    max-image-side: ${GEMINI_MAX_IMAGE_SIDE:1280}
    jpeg-quality: ${GEMINI_JPEG_QUALITY:0.82}

mqtt:
  # docker-compose 서비스 이름이 mosquitto 이면 동일 네트워크에서 호스트명도 mosquitto
  broker-url: ${MQTT_BROKER_URL:tcp://mosquitto:1883}
  client-id: ${MQTT_CLIENT_ID:greeneye-backend}
  subscriber-client-id: ${MQTT_SUBSCRIBER_CLIENT_ID:greeneye-backend-sub}

# 로컬에서만 true (IDE 환경변수 GREENEYE_DEV_USER_ENABLED=true). 배포 Docker에서는 false 유지.
greeneye:
  dev-user:
    enabled: ${GREENEYE_DEV_USER_ENABLED:false}
    oauth-id: ${GREENEYE_DEV_USER_OAUTH_ID:dev-local-greeneye}
  # 외부 IoT(ESP32) 공개 브로커 정보 (/api/iot/config 노출): Cloudflare Tunnel WebSocket 경로 기준
  iot:
    mqtt-host: mqtt-greeneye.gwon.run
    mqtt-port: 80