; Windows: PowerShell에서 "pio" 없으면 아래 중 하나 사용 (이 폴더에서 실행)
;   iot.cmd run -t upload
;   iot.cmd device monitor -b 115200
;   또는  python -m platformio run -t upload   (python이 진짜 3.12로 잡힐 때)
; 업로드 전 아래 build_flags 의 GREENEYE_MODULE_SERIAL 만 g1 / g2 / g20 등으로 변경
; MQTT: Cloudflare 터널 → Mosquitto WebSockets(9001) → WSS
; WSS는 esp_crt_bundle_attach(ESP CA 번들)로 서버 검증. 검증 수단 없이 연결하면 esp-tls가 거부함.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.sdkconfig.defaults = sdkconfig.defaults
monitor_speed = 115200
upload_speed = 115200
; 이 보드의 DB serial과 MQTT 토픽 접두: greeneye/<여기>/cmd|status
; main.cpp 는 건드리지 않음 — build_flags 만 변경
build_flags = -DGREENEYE_MODULE_SERIAL=g1000
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
